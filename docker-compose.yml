services:
  app:
    build: .
    env_file: .env
    ports:
      - "${APP_PORT:-9520}:9520"
    environment:
      - APP_PORT=9520
      - DB_CONNECTION_STRING=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-gocode}?sslmode=disable
      # These will override or complement what's in .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-gocode}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gocode}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
